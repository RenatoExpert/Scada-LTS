---
name: scada_dev_v$(Build.BuildId)

trigger:
  branches:
    include:
      - refs/heads/release

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: templates
      type: git
      name: 'devops-template'
      ref: master

variables:
- name: containerRegistry
  value: scadaregistry
- name: dockerNamespace
  value: scadaregistrydev.azurecr.io
- name: imageName
  value: scada-dev
- name: azureSubscription
  value: scada
- name: dockerRegistryServiceConnection
  value: scadaregistry
- name: dockerRepository
  value: scada-dev

- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
  - template: variables-dev.yml
      
stages:
  - stage: Build
    displayName: 'Build'
    jobs: 
    - job: Build
      steps:
      - template: java/azure/webapp/steps/docker-build-template-v1.yml@templates
        parameters:
          repository: $(imageName)
          dockerfile: '$(Pipeline.Workspace)/**/Dockerfile'
          containerRegistry: scadaregistry
          

          

  - stage: DeployDEV
    displayName: 'Deploy DEV'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/release'))
    jobs:
    - deployment:
      environment: Development
      strategy:
       runOnce:
         deploy:
           steps:
             - template: java/azure/webapp/steps/webapp-deploy-template-v1.yml@templates
               parameters:
                 webAppName: scada-dev
                 dockerNamespace: $(dockerNamespace)
                 dockerRepository: $(dockerRepository)
                 appSettingsValues: $(appSettingsValues) 
                 azureSubscription: $(azureSubscription)

   