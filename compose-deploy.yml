services: 
    database:
        extends:
            file: compose-base.yml
            service: database
        container_name: mysql-${BRANCH}
        ports:
            - "${PORT_DB}:3306"
        volumes:
            - /volumes/${BRANCH}/database/data:/var/lib/mysql:rw
            - /volumes/${BRANCH}/database/config:/etc/mysql:ro

    argos:
        extends:
            file: compose-base.yml
            service: argos
        container_name: argos-${BRANCH}
        ports: 
            - "${PORT_WEB}:8080"
        links:
            - database:database
        depends_on:
            opcuaserver:
              condition: service_healthy
            database:
              condition: service_healthy

    opcuaserver:
        extends:
            file: compose-base.yml
            service: opcuaserver
        container_name: opcuaserver-${BRANCH}
        ports:
            - "${PORT_OPC}:4840"

