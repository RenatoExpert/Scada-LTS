# docker stack deploy --compose-file compose-deploy.yml tree-renato
services:
    database:
      image: mysql/mysql-server:8.0.32
      environment:
          - MYSQL_ROOT_PASSWORD=root
          - MYSQL_USER=root
          - MYSQL_PASSWORD=root
          - MYSQL_DATABASE=scadalts
      command: --log_bin_trust_function_creators=1
      deploy:
        mode: global
        resources:
          limits:
            cpus: "1"
            memory: "768M"
          reservations:
            cpus: "0.1"
            memory: "256M"
        restart_policy:
          condition: on-failure
          max_attempts: 15
          delay: 3s
      ulimits:
        nofile:
          soft: 128
          hard: 1024
      healthcheck:
          test: mysqladmin ping -h localhost
          retries: 5
          start_period: 30s
          start_interval: 15s
          interval: 5s
          timeout: 15s
      ports:
          - target: 3306
            published: ${PORT_DB:-8881}
            mode: host
      volumes:
          - database_lib:/var/lib/mysql:rw
          - database_etc:/etc/mysql:ro
      networks:
          - scadanet

    argos:
      image: scada-argos.eastus2.cloudapp.azure.com:8793/argos:${BRANCH:-release}
      build:
          context: .
          dockerfile: Dockerfile
          target: war_deploy
      environment:
          - CATALINA_OPTS=-Xmx512m -Xms512m
      deploy:
        mode: global
        resources:
          limits:
            cpus: "2"
            memory: "1.2G"
          reservations:
            cpus: "0.3"
            memory: "512M"
        restart_policy:
          condition: on-failure
          max_attempts: 15
          delay: 3s
      healthcheck:
        test: curl -X GET -sf http://localhost:8080/Scada-LTS/ || exit 1
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 1m
        start_interval: 1m
      ports:
          - target: 8080
            published: ${PORT_WEB:-8880}
            mode: host
      depends_on:
          - database
      extra_hosts:
          - "linuxhost:host-gateway"
      networks:
          - scadanet

networks:
    scadanet:
      name: ${BRANCH:-main}_network

volumes:
  database_lib:
    name: argos_${BRANCH:-main}_database_lib
  database_etc:
    name: argos_${BRANCH:-main}_database_etc

